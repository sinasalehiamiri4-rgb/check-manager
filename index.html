<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت چک و حواله</title>

  <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' style='background:linear-gradient(135deg, %234f46e5, %23818cf8);'><text x='50%' y='54%' font-size='280' text-anchor='middle' dominant-baseline='middle'>💰</text></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' style='background:linear-gradient(135deg, %234f46e5, %23818cf8);'><text x='50%' y='54%' font-size='280' text-anchor='middle' dominant-baseline='middle'>💰</text></svg>">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

  <style>
    /* ⬇️ استایل‌های قبلی خودت رو اینجا بذار - هیچ تغییری لازم نیست ⬇️ */
    /* (همون استایلی که توی فایل خودت داشتی رو دست نزن) */
  </style>
</head>
<body>

  <!-- ⬇️ تمام HTML قبلی خودت رو دست نزن ⬇️ -->
  <!-- فقط این خط رو قبل از </body> اضافه کن: -->
  
  <div id="fbStatus">
    <i class="fa-solid fa-circle-notch fa-spin"></i>
    <span>در حال اتصال به Firebase...</span>
  </div>

  <!-- ⬇️ اسکریپت‌ها رو با این جایگزین کن ⬇️ -->

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
      onSnapshot, query, orderBy, getDoc, setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 🔥 کانفیگ Firebase خودت
    const firebaseConfig = {
      apiKey: "AIzaSyAKeNJizka9ynVjYLCsz8-5mJ1varYcHaQ",
      authDomain: "check-manager-fcea9.firebaseapp.com",
      projectId: "check-manager-fcea9",
      storageBucket: "check-manager-fcea9.firebasestorage.app",
      messagingSenderId: "869718533155",
      appId: "1:869718533155:web:684f32d47a62ed096c7d96",
      measurementId: "G-48JFJNQQJY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🌐 در دسترس قرار دادن برای اسکریپت اصلی
    window.__firebase = {
      db,
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy,
      getDoc,
      setDoc
    };

    // آپدیت وضعیت اتصال
    const statusEl = document.getElementById('fbStatus');
    statusEl.classList.add('connected');
    statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i><span>متصل به Firebase</span>';

    // فراخوانی راه‌اندازی بعد از لود شدن ماژول
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script>
    // ============================================================
    // ⬇️ اینجا اسکریپت اصلی خودت رو با تغییرات زیر قرار بده ⬇️
    // ============================================================

    let checks = [];
    let currentTab = 'در انتظار';
    let fbReady = false;
    let unsubscribeChecks = null;

    // منتظر Firebase بمون
    window.addEventListener('firebase-ready', () => {
      fbReady = true;
      initFirebaseSync();
    });

    // 🔥 اتصال Real-time به Firestore
    function initFirebaseSync() {
      const { db, collection, onSnapshot } = window.__firebase;

      unsubscribeChecks = onSnapshot(collection(db, "checks"), (snapshot) => {
        checks = [];
        snapshot.forEach((docSnap) => {
          checks.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderTable();
        checkAlerts();
      }, (error) => {
        console.error("Firestore error:", error);
        const statusEl = document.getElementById('fbStatus');
        statusEl.classList.add('error');
        statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span>خطا در اتصال</span>';
      });

      // بارگذاری لوگو از Firestore
      loadLogoFromFirestore();
    }

    // 🖼️ ذخیره لوگو در Firestore
    async function loadLogoFromFirestore() {
      const { db, doc, getDoc } = window.__firebase;
      try {
        const logoDoc = await getDoc(doc(db, "settings", "logo"));
        if (logoDoc.exists()) {
          displayLogo(logoDoc.data().data);
        }
      } catch (e) {
        console.warn("لوگو یافت نشد:", e);
      }
    }

    async function uploadLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async function(e) {
          const logoData = e.target.result;
          displayLogo(logoData);
          try {
            const { db, doc, setDoc } = window.__firebase;
            await setDoc(doc(db, "settings", "logo"), { data: logoData, updatedAt: new Date() });
          } catch (err) {
            console.error("خطا در ذخیره لوگو:", err);
            alert("خطا در ذخیره لوگو توی Firebase");
          }
        };
        reader.readAsDataURL(file);
      }
    }

    function displayLogo(src) {
      document.getElementById('logoPreview').innerHTML = `<img src="${src}" alt="Logo">`;
      document.getElementById('printLogoContainer').innerHTML = `<img src="${src}" class="print-logo" alt="Logo">`;
    }

    // 💾 ذخیره چک (جدید یا ویرایش)
    async function saveCheck(e) {
      e.preventDefault();
      if (!fbReady) { alert("اتصال به Firebase برقرار نیست"); return; }

      const id = document.getElementById('checkId').value;
      const rawDueDate = document.getElementById('dueDate').value;
      const normDueDate = normalizeDateStr(rawDueDate);
      const statusValue = document.getElementById('status').value;
      const rawAmount = toEnglishDigits(document.getElementById('amount').value).replace(/,/g, '');

      const checkData = {
        issuer: document.getElementById('issuer').value,
        bank: document.getElementById('bank').value,
        type: document.getElementById('type').value,
        serial: toEnglishDigits(document.getElementById('serial').value),
        sayadi: document.getElementById('sayadi').disabled ? '' : toEnglishDigits(document.getElementById('sayadi').value),
        amount: parseFloat(rawAmount),
        dueDate: normDueDate,
        isDelivered: document.getElementById('isDelivered').value,
        status: statusValue,
        updatedAt: new Date()
      };

      const { db, collection, doc, addDoc, updateDoc } = window.__firebase;

      try {
        if (id) {
          // ویرایش (id الان یه string از Firestore هست)
          await updateDoc(doc(db, "checks", id), checkData);
        } else {
          // جدید
          checkData.createdAt = new Date();
          await addDoc(collection(db, "checks"), checkData);
        }
        switchTab(statusValue);
        resetForm();
      } catch (err) {
        console.error("خطا در ذخیره:", err);
        alert("خطا در ذخیره سند!");
      }
    }

    // 🗑️ حذف از Firestore
    async function deleteCheck(id) {
      if (!confirm('آیا از حذف این ردیف مطمئن هستید؟')) return;
      const { db, doc, deleteDoc } = window.__firebase;
      try {
        await deleteDoc(doc(db, "checks", id));
      } catch (err) {
        console.error("خطا در حذف:", err);
        alert("خطا در حذف!");
      }
    }

    // 🔄 تغییر وضعیت تحویل
    async function toggleDelivery(id) {
      const { db, doc, updateDoc } = window.__firebase;
      const c = checks.find(item => item.id === id);
      if (!c) return;
      try {
        await updateDoc(doc(db, "checks", id), {
          isDelivered: c.isDelivered === 'بله' ? 'خیر' : 'بله'
        });
      } catch (err) {
        console.error(err);
      }
    }

    // ============================================================
    // ⬇️ بقیه توابع خودت رو بدون تغییر نگه دار ⬇️
    // (فقط توابع مربوط به localStorage رو حذف کن)
    // ============================================================

    function toggleFontSize() {
      document.body.classList.toggle('large-font');
      const isLarge = document.body.classList.contains('large-font');
      localStorage.setItem('is_large_font', isLarge);
      const btnText = document.getElementById('fontSizeBtnText');
      if (btnText) btnText.innerText = isLarge ? 'فونت معمولی' : 'فونت بزرگ';
    }

    function loadFontSizeState() {
      const isLarge = localStorage.getItem('is_large_font') === 'true';
      if (isLarge) {
        document.body.classList.add('large-font');
        const btnText = document.getElementById('fontSizeBtnText');
        if (btnText) btnText.innerText = 'فونت معمولی';
      }
    }

    function toggleMobileMenu(e) {
      e.stopPropagation();
      document.getElementById('mobileDropdown').classList.toggle('show');
    }

    function closeMobileMenu() {
      document.getElementById('mobileDropdown').classList.remove('show');
    }

    document.addEventListener('click', () => {
      const dropdown = document.getElementById('mobileDropdown');
      if (dropdown && dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
      }
    });

    function toPersianDigits(str) {
      if (str === null || str === undefined) return '';
      return str.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function toEnglishDigits(str) {
      if (!str) return '';
      return str.toString().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    }

    function formatDigitsInput(input) {
      let cursorPos = input.selectionStart;
      let converted = toEnglishDigits(input.value);
      if (input.value !== converted) {
        input.value = converted;
        try { input.setSelectionRange(cursorPos, cursorPos); } catch (err) {}
      }
    }

    function getTodayJalaliNormalized() {
      const parts = new Intl.DateTimeFormat('fa-IR-u-nu-latn', {
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      const y = parts.find(p => p.type === 'year').value;
      const m = parts.find(p => p.type === 'month').value;
      const d = parts.find(p => p.type === 'day').value;
      return `${y}/${m}/${d}`;
    }

    function normalizeDateStr(dateStr) {
      if (!dateStr) return '';
      let cleanStr = toEnglishDigits(dateStr).trim().replace(/-/g, '/');
      const parts = cleanStr.split('/');
      if (parts.length === 3) {
        return `${parts[0]}/${parts[1].padStart(2, '0')}/${parts[2].padStart(2, '0')}`;
      }
      return cleanStr;
    }

    function isDueOrPast(dueDateStr) {
      if (!dueDateStr) return false;
      return normalizeDateStr(dueDateStr) <= getTodayJalaliNormalized();
    }

    function updateLiveClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').innerText = toPersianDigits(`${h}:${m}:${s}`);
      const dateStr = now.toLocaleDateString('fa-IR', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
      document.getElementById('liveDate').innerText = dateStr;
      document.getElementById('print-date').innerText = dateStr + ' - ' + toPersianDigits(`${h}:${m}`);
    }

    document.addEventListener('DOMContentLoaded', () => {
      setInterval(updateLiveClock, 1000);
      updateLiveClock();
      loadFontSizeState();

      $('#dueDate').persianDatepicker({
        format: 'YYYY/MM/DD', initialValue: true, autoClose: true,
        calendar: { persian: { leapYearMode: 'astronomical' } }
      });
      $('#fromDateFilter').persianDatepicker({
        format: 'YYYY/MM/DD', initialValue: false, autoClose: true,
        onSelect: () => renderTable(),
        calendar: { persian: { leapYearMode: 'astronomical' } }
      });
      $('#toDateFilter').persianDatepicker({
        format: 'YYYY/MM/DD', initialValue: false, autoClose: true,
        onSelect: () => renderTable(),
        calendar: { persian: { leapYearMode: 'astronomical' } }
      });
    });

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tabName === 'در انتظار') document.getElementById('tab-pending').classList.add('active');
      if (tabName === 'پاس شده') document.getElementById('tab-passed').classList.add('active');
      if (tabName === 'برگشتی') document.getElementById('tab-bounced').classList.add('active');
      renderTable();
    }

    function handleTypeChange(typeValue) {
      const sayadiInput = document.getElementById('sayadi');
      const sayadiLabel = document.getElementById('sayadiLabel');
      if (typeValue === 'حواله') {
        sayadiInput.value = '';
        sayadiInput.disabled = true;
        sayadiInput.placeholder = 'فاقد شناسه صیادی';
        sayadiLabel.style.opacity = '0.5';
      } else {
        sayadiInput.disabled = false;
        sayadiInput.placeholder = '1234-5678-9012-3456';
        sayadiLabel.style.opacity = '1';
      }
    }

    function formatSayadi(input) {
      formatDigitsInput(input);
      if (input.disabled) return;
      let value = input.value.replace(/\D/g, '');
      if (value.length > 16) value = value.substring(0, 16);
      const parts = value.match(/.{1,4}/g);
      input.value = parts ? parts.join('-') : '';
    }

    function clearDateFilters() {
      document.getElementById('fromDateFilter').value = '';
      document.getElementById('toDateFilter').value = '';
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('checkTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filterType = document.getElementById('filterType').value;
      const filterDelivered = document.getElementById('filterDelivered').value;
      const normFromDate = normalizeDateStr(document.getElementById('fromDateFilter').value);
      const normToDate = normalizeDateStr(document.getElementById('toDateFilter').value);

      tbody.innerHTML = '';

      let pendingTotal = 0, passedTotal = 0, bouncedTotal = 0, deliveredCount = 0;
      let countP = 0, countPass = 0, countB = 0;

      checks.forEach(c => {
        if (c.status === 'در انتظار') { pendingTotal += c.amount; countP++; }
        if (c.status === 'پاس شده') { passedTotal += c.amount; countPass++; }
        if (c.status === 'برگشتی') { bouncedTotal += c.amount; countB++; }
        if (c.isDelivered === 'بله') deliveredCount++;
      });

      document.getElementById('statPending').innerText = toPersianDigits(pendingTotal.toLocaleString('fa-IR'));
      document.getElementById('statDelivered').innerText = toPersianDigits(deliveredCount) + ' عدد';
      document.getElementById('statPassed').innerText = toPersianDigits(passedTotal.toLocaleString('fa-IR'));
      document.getElementById('statBounced').innerText = toPersianDigits(bouncedTotal.toLocaleString('fa-IR'));
      document.getElementById('countPending').innerText = toPersianDigits(countP);
      document.getElementById('countPassed').innerText = toPersianDigits(countPass);
      document.getElementById('countBounced').innerText = toPersianDigits(countB);

      let filtered = checks.filter(c => {
        const matchesTab = (c.status === currentTab);
        const matchesSearch = (c.issuer || '').toLowerCase().includes(search) ||
                              (c.bank || '').toLowerCase().includes(search) ||
                              (c.serial || '').includes(search) ||
                              (c.sayadi && c.sayadi.includes(search));
        const matchesType = filterType === 'همه' || c.type === filterType;
        const matchesDelivered = filterDelivered === 'همه' || (c.isDelivered || 'خیر') === filterDelivered;
        const normDue = normalizeDateStr(c.dueDate);
        let matchesDateRange = true;
        if (normFromDate && normDue < normFromDate) matchesDateRange = false;
        if (normToDate && normDue > normToDate) matchesDateRange = false;
        return matchesTab && matchesSearch && matchesType && matchesDelivered && matchesDateRange;
      });

      filtered.sort((a, b) => normalizeDateStr(a.dueDate).localeCompare(normalizeDateStr(b.dueDate)));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--text-muted); padding: 20px;">هیچ سندی در این بخش یافت نشد.</td></tr>`;
        return;
      }

      filtered.forEach((c) => {
        const isDue = c.status === 'در انتظار' && isDueOrPast(c.dueDate);
        let badgeClass = 'badge-pending';
        let statusText = c.status;
        if (isDue) { badgeClass = 'badge-due-alert'; statusText = '⚠️ سررسید شده'; }
        else if (c.status === 'پاس شده') badgeClass = 'badge-passed';
        else if (c.status === 'برگشتی') badgeClass = 'badge-bounced';

        const isDelivered = c.isDelivered === 'بله';
        const deliveredBadge = isDelivered
          ? `<span class="badge badge-delivered-yes"><i class="fa-solid fa-check"></i> بله</span>`
          : `<span class="badge badge-delivered-no"><i class="fa-solid fa-xmark"></i> خیر</span>`;

        let sayadiDisplay = '-';
        if (c.sayadi) sayadiDisplay = toPersianDigits(c.sayadi);
        else if (c.type === 'حواله') sayadiDisplay = '<span style="color:var(--text-muted); font-size:11px;">— (حواله)</span>';

        const tr = document.createElement('tr');
        if (isDue) tr.classList.add('row-due-today');
        tr.onclick = (e) => {
          if (window.innerWidth <= 768 && !e.target.closest('button')) openModal(c.id);
        };

        tr.innerHTML = `
          <td data-label="طرف حساب"><strong>${c.issuer}</strong></td>
          <td data-label="بانک">${c.bank}</td>
          <td data-label="نوع سند">${c.type || 'چک'}</td>
          <td data-label="سریال">${toPersianDigits(c.serial)}</td>
          <td data-label="صیادی" dir="ltr" style="text-align: right;">${sayadiDisplay}</td>
          <td data-label="مبلغ (ریال)"><strong>${toPersianDigits(Number(c.amount).toLocaleString('fa-IR'))}</strong></td>
          <td data-label="سررسید"><strong>${toPersianDigits(c.dueDate)}</strong></td>
          <td data-label="تحویل بانک">
            ${deliveredBadge}
            <button class="btn btn-outline no-print" style="padding:2px 6px; font-size:11px; margin-right:4px;" title="تغییر وضعیت" onclick="toggleDelivery('${c.id}')">
              <i class="fa-solid fa-arrows-rotate"></i>
            </button>
          </td>
          <td data-label="وضعیت"><span class="badge ${badgeClass}">${statusText}</span></td>
          <td class="action-btns no-print">
            <button class="btn btn-outline" style="padding:5px 9px;" title="ویرایش" onclick="editCheck('${c.id}')"><i class="fa-solid fa-pen" style="color:var(--primary)"></i></button>
            <button class="btn btn-outline" style="padding:5px 9px;" title="حذف" onclick="deleteCheck('${c.id}')"><i class="fa-solid fa-trash" style="color:var(--danger)"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal(id) {
      const c = checks.find(item => item.id === id);
      if (!c) return;
      let sayadiText = c.sayadi ? toPersianDigits(c.sayadi) : (c.type === 'حواله' ? '— (حواله)' : '-');
      const isDue = c.status === 'در انتظار' && isDueOrPast(c.dueDate);
      let statusText = c.status;
      if (isDue) statusText = '⚠️ سررسید شده';

      document.getElementById('modalDetailsBody').innerHTML = `
        <div class="modal-item"><span class="label">طرف حساب:</span><span class="value">${c.issuer}</span></div>
        <div class="modal-item"><span class="label">بانک:</span><span class="value">${c.bank}</span></div>
        <div class="modal-item"><span class="label">نوع سند:</span><span class="value">${c.type || 'چک'}</span></div>
        <div class="modal-item"><span class="label">شماره سریال:</span><span class="value">${toPersianDigits(c.serial)}</span></div>
        <div class="modal-item"><span class="label">شناسه صیادی:</span><span class="value" dir="ltr">${sayadiText}</span></div>
        <div class="modal-item"><span class="label">مبلغ:</span><span class="value" style="color:var(--primary)">${toPersianDigits(Number(c.amount).toLocaleString('fa-IR'))} ریال</span></div>
        <div class="modal-item"><span class="label">تاریخ سررسید:</span><span class="value">${toPersianDigits(c.dueDate)}</span></div>
        <div class="modal-item"><span class="label">تحویل به بانک:</span><span class="value">${c.isDelivered || 'خیر'}</span></div>
        <div class="modal-item"><span class="label">وضعیت:</span><span class="value">${statusText}</span></div>
      `;
      document.getElementById('modalEditBtn').onclick = () => { closeModal(); editCheck(c.id); };
      document.getElementById('detailModal').classList.add('show');
    }

    function closeModal() { document.getElementById('detailModal').classList.remove('show'); }

    function editCheck(id) {
      const c = checks.find(item => item.id === id);
      if (c) {
        document.getElementById('checkId').value = c.id;
        document.getElementById('issuer').value = c.issuer;
        document.getElementById('bank').value = c.bank;
        document.getElementById('type').value = c.type || 'چک';
        handleTypeChange(c.type || 'چک');
        document.getElementById('serial').value = toPersianDigits(c.serial);
        document.getElementById('sayadi').value = c.sayadi ? toPersianDigits(c.sayadi) : '';
        document.getElementById('amount').value = toPersianDigits(c.amount);
        document.getElementById('dueDate').value = c.dueDate;
        document.getElementById('isDelivered').value = c.isDelivered || 'خیر';
        document.getElementById('status').value = c.status;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function resetForm() {
      document.getElementById('checkId').value = '';
      document.getElementById('checkForm').reset();
      handleTypeChange('چک');
      document.getElementById('dueDate').value = getTodayJalaliNormalized();
    }

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }

    // 📥 خروجی JSON (برای پشتیبان‌گیری)
    function exportBackup() {
      if (checks.length === 0) { alert('اطلاعاتی برای بک‌اپ گیری وجود ندارد.'); return; }
      const backupData = { checks, exportDate: new Date().toISOString() };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const a = document.createElement('a');
      const todayStr = getTodayJalaliNormalized().replace(/\//g, '-');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `پشتیبان_چک_و_حواله_${todayStr}.json`);
      document.body.appendChild(a); a.click(); a.remove();
    }

    // 📤 بازیابی از JSON و آپلود به Firestore
    async function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          const importedChecks = importedData.checks || importedData;
          if (!Array.isArray(importedChecks)) { alert('فرمت فایل معتبر نیست.'); return; }
          if (!confirm('اطلاعات فعلی با اطلاعات فایل جایگزین می‌شود. مطمئنید؟')) return;

          const { db, collection, addDoc } = window.__firebase;
          for (const c of importedChecks) {
            const data = { ...c };
            delete data.id;
            await addDoc(collection(db, "checks"), data);
          }
          alert('بازیابی با موفقیت انجام شد.');
        } catch (err) {
          console.error(err);
          alert('خطا در خواندن فایل!');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // 📊 خروجی اکسل (دقیقاً مثل قبل)
    function exportExcel() {
      if (checks.length === 0) { alert('اطلاعاتی برای خروجی اکسل وجود ندارد.'); return; }
      const workbook = XLSX.utils.book_new();
      const categories = [
        { name: "اسناد در انتظار", status: "در انتظار" },
        { name: "اسناد پاس شده", status: "پاس شده" },
        { name: "اسناد برگشتی", status: "برگشتی" }
      ];
      const borderThin = { top:{style:"thin",color:{rgb:"000000"}}, bottom:{style:"thin",color:{rgb:"000000"}}, left:{style:"thin",color:{rgb:"000000"}}, right:{style:"thin",color:{rgb:"000000"}} };
      const headerStyle = { font:{name:"Tahoma",sz:11,bold:true,color:{rgb:"FFFFFF"}}, fill:{fgColor:{rgb:"4F46E5"}}, alignment:{horizontal:"center",vertical:"center"}, border:borderThin };
      const cellStyleCenter = { font:{name:"Tahoma",sz:10}, alignment:{horizontal:"center",vertical:"center"}, border:borderThin };
      const cellStyleRight = { font:{name:"Tahoma",sz:10}, alignment:{horizontal:"right",vertical:"center"}, border:borderThin };
      const totalRowStyle = { font:{name:"Tahoma",sz:11,bold:true,color:{rgb:"000000"}}, fill:{fgColor:{rgb:"E2E8F0"}}, alignment:{horizontal:"center",vertical:"center"}, border:borderThin };

      categories.forEach(cat => {
        const catChecks = checks.filter(c => c.status === cat.status);
        const excelData = [["ردیف","نام طرف حساب","بانک","نوع سند","شماره سریال","شناسه صیادی","مبلغ (ریال)","تاریخ سررسید","تحویل به بانک","وضعیت"]];
        let totalAmount = 0;
        catChecks.forEach((c, index) => {
          const amountVal = Number(c.amount) || 0;
          totalAmount += amountVal;
          excelData.push([
            toPersianDigits(index + 1), c.issuer || '', c.bank || '', c.type || 'چک',
            toPersianDigits(c.serial || ''),
            c.sayadi ? toPersianDigits(c.sayadi) : (c.type === 'حواله' ? '— (حواله)' : '-'),
            amountVal, toPersianDigits(c.dueDate || ''), c.isDelivered || 'خیر', c.status || ''
          ]);
        });
        excelData.push(["جمع کل","","","","","",totalAmount,"","",""]);

        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        const range = XLSX.utils.decode_range(worksheet['!ref']);
        for (let R = range.s.r; R <= range.e.r; ++R) {
          for (let C = range.s.c; C <= range.e.c; ++C) {
            const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
            if (!worksheet[cellAddress]) continue;
            if (R === 0) worksheet[cellAddress].s = headerStyle;
            else if (R === range.e.r) {
              worksheet[cellAddress].s = totalRowStyle;
              if (C === 6) worksheet[cellAddress].z = '#,##0';
            } else {
              worksheet[cellAddress].s = (C === 1) ? cellStyleRight : cellStyleCenter;
              if (C === 6 && typeof worksheet[cellAddress].v === 'number') worksheet[cellAddress].z = '#,##0';
            }
          }
        }
        worksheet['!merges'] = [{ s:{r:range.e.r,c:0}, e:{r:range.e.r,c:5} }];
        worksheet['!views'] = [{ RTL: true }];
        worksheet['!cols'] = [{wch:8},{wch:22},{wch:16},{wch:12},{wch:16},{wch:22},{wch:18},{wch:15},{wch:15},{wch:15}];
        XLSX.utils.book_append_sheet(workbook, worksheet, cat.name);
      });
      const todayStr = getTodayJalaliNormalized().replace(/\//g, '-');
      XLSX.writeFile(workbook, `مدیریت_چک_و_حواله_${todayStr}.xlsx`);
    }

    function checkAlerts() {
      const dueChecks = checks.filter(c => c.status === 'در انتظار' && isDueOrPast(c.dueDate));
      if (dueChecks.length > 0) {
        document.getElementById('todayAlert').style.display = 'flex';
        document.getElementById('alertCount').innerText = toPersianDigits(dueChecks.length);
      } else {
        document.getElementById('todayAlert').style.display = 'none';
      }
    }

    function filterToday() { switchTab('در انتظار'); }
  </script>
